<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBPMP Jatim Hotspot</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f8f9fa;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            background: #d62976;
            color: white;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Koneksi Berhasil!</h2>
        <p>Silakan klik tombol di bawah untuk membuka Instagram BBPMP Jatim:</p>
        <a id="igLink" href="https://www.instagram.com/bbpmpjatim/" class="btn">Buka Instagram</a>
    </div>

    <script>
        window.onload = function() {
            // Coba buka aplikasi Instagram via Intent
            window.location.href = "intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;";
        };
    </script>
</body>
</html>
