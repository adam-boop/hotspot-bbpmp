<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Instagram...</title>
    <!-- Auto Redirect Instant via Meta Tag -->
    <meta http-equiv="refresh" content="0;url=intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        .btn-ig {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Membuka Instagram...</h2>
        <p style="color: #606770; font-size: 14px; margin-top: 8px;">Jika aplikasi tidak terbuka otomatis, ketuk tombol di bawah:</p>
        
        <a href="intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;" class="btn-ig">
            Buka Instagram Sekarang
        </a>
    </div>

    <script>
        // Pemicu Instant JS
        (function() {
            var intentUrl = "intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;";
            window.location.href = intentUrl;
        })();

        // Pemicu Otomatis saat Sentuh Layar
        document.addEventListener('touchstart', function() {
            window.location.href = "intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;";
        }, {once: true});
    </script>
</body>
</html>
