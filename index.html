<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBPMP Jatim Hotspot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        h2 {
            color: #1c1e21;
            font-size: 20px;
            margin-bottom: 8px;
        }
        p {
            color: #606770;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        .btn-ig {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(225, 48, 108, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✅</div>
        <h2>Internet Terhubung!</h2>
        <p>Silakan ketuk tombol di bawah ini untuk melanjutkan ke Instagram Resmi BBPMP Jawa Timur.</p>
        
        <a href="intent://user?username=bbpmpjatim#Intent;package=com.instagram.android;scheme=instagram;end;" class="btn-ig">
            Buka Aplikasi Instagram
        </a>
    </div>

</body>
</html>
